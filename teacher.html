<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師教學進度｜micro:bit 互動教室</title><link rel="stylesheet" href="teacher.css"><script src="teacher-catalog.js" defer></script><script src="teacher-config.js" defer></script><script src="teacher-client.js" defer></script><script src="teacher.js" defer></script></head>
<body><header><a class="brand" href="index.html">micro:bit <span>教師專區</span></a><a href="index.html" class="button">返回課程首頁</a></header><main>
<div class="page-heading"><div><span class="eyebrow">TEACHER'S DESK</span><h1>每一班，都接得上。</h1><p>使用校內 Google 帳號，記下今天教到哪裡，下次從同一步繼續。</p></div><div><p id="teacherIdentity"></p><p id="loginStatus" role="status"></p></div></div>
<section id="dashboard" hidden><div class="scope-panel"><div class="filters"><label for="schoolYear">學年度<input id="schoolYear" type="number" min="115" max="999" step="1" value="115" list="yearChoices"><datalist id="yearChoices"></datalist></label><label for="classId">班級<select id="classId"><option>601</option><option>602</option><option>603</option><option>604</option><option>605</option></select></label><button class="button primary" id="loadScope">載入班級進度</button></div><p class="hint">學年度從115開始，可輸入後續學年度。班級進度各自保存。</p></div><div class="scope-heading"><h2 id="scopeTitle">115 學年度 · 601 班</h2><p id="cloudStatus" role="status" aria-live="polite"></p></div><div class="course-picker"><label for="teacherCourse">選擇課程</label><select id="teacherCourse" aria-controls="courseProgress"><option value="">請選擇要管理的課程</option></select></div><p id="coursePrompt" class="hint">選擇課程後，顯示該課的教學進度與備註。</p><div id="courseProgress" class="course-progress" hidden></div><p class="hint">接續上課會自動儲存檢查步驟。教師進度會跨電腦同步；MakeCode 積木作品仍保存在使用中的瀏覽器。</p></section>
</main><footer>micro:bit 互動教室 · 校內 Google 帳號登入 · 各教師進度分開保存 · 公用電腦使用後請登出 Google 帳號</footer></body></html>
