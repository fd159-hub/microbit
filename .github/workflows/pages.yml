name: Deploy classroom to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lesson scripts
        run: node --check guided.js && node --check guide-steps.js && node --check lessons.js && node --check sim09.js && node --check guide-steps08.js && node --check lessons08.js && node --check sim08.js && node --check guide-steps10.js && node --check lessons10.js && node --check sim10.js && node --check sim-compass.js && node --check lessons11.js && node --check lessons12.js && node --check guide-steps11.js && node --check guide-steps12.js
      - uses: actions/configure-pages@v5
      - name: Package classroom
        run: mkdir -p _site && cp index.html lesson08.html lesson09.html lesson10.html cover.css guided.css guided.js guide-steps.js guide-steps08.js lessons.js lessons08.js sim09.js sim08.js guide-steps10.js lessons10.js sim10.js lesson11.html lesson12.html lessons11.js lessons12.js guide-steps11.js guide-steps12.js sim-compass.js _site/ && cp -r assets _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
